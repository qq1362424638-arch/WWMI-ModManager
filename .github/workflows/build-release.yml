name: Build Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        shell: pwsh
        run: |
          npm run dist:win:dir 2>&1 | Tee-Object -FilePath electron-builder-dir.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/WWMI-ModManager-0.1.0-win-x64.zip -Force

          npm run dist:win 2>&1 | Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List dist on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem -Recurse dist | Select-Object FullName,Length,LastWriteTime
          }

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WWMI-ModManager-Windows
          path: |
            dist/WWMI-ModManager-*-win-x64.zip
            dist/WWMI-ModManager-Setup-*-x64.exe
            dist/WWMI-ModManager-Setup-*-x64.exe.blockmap

      - name: Upload debug artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WWMI-ModManager-debug
          path: |
            electron-builder.log
            electron-builder-dir.log
            dist/builder-debug.yml
            dist/**/*.log

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/WWMI-ModManager-*-win-x64.zip \
            dist/WWMI-ModManager-Setup-*-x64.exe \
            dist/WWMI-ModManager-Setup-*-x64.exe.blockmap \
            --clobber
